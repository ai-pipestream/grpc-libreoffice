plugins {
    id 'application'
    id 'com.google.protobuf' version '0.10.0'
}

def grpcVersion = '1.83.1'
def protobufVersion = '4.35.1'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    implementation "io.grpc:grpc-netty-shaded:${grpcVersion}"
    implementation "io.grpc:grpc-protobuf:${grpcVersion}"
    implementation "io.grpc:grpc-stub:${grpcVersion}"
    // grpc-protobuf pins the 3.25 runtime; code generated by protoc 4.x
    // needs the matching 4.x protobuf-java.
    implementation "com.google.protobuf:protobuf-java:${protobufVersion}"
}

sourceSets {
    main {
        proto {
            // The repo's proto tree; only the office service is needed.
            srcDir '../../proto'
            include 'ai/pipestream/office/v1/office_service.proto'
            include 'ai/pipestream/document/v1/document.proto'
        }
    }
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:${protobufVersion}"
    }
    plugins {
        grpc {
            artifact = "io.grpc:protoc-gen-grpc-java:${grpcVersion}"
        }
    }
    generateProtoTasks {
        all()*.plugins {
            grpc {}
        }
    }
}

application {
    mainClass = 'ai.pipestream.office.examples.OfficeClient'
}
