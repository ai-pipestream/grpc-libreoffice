name: Publish Image

# Builds the image (the build stage runs the full test suite, real LibreOffice
# renders included, so the push is gated on green) and pushes it to
# docker.io/pipestreamai and our Forgejo container registry. Dispatch this
# from Forgejo (git.rokkon.com), where the DOCKER_USER/DOCKER_TOKEN and
# CICD_TOKEN org secrets live; on the GitHub mirror the secrets are absent
# and a stray dispatch fails at login, pushing nothing.
#
# amd64 only for now; LibreOffice exists on arm64 and a matrix build on the
# arm64 runners can follow if a consumer needs it.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Image version tag (for example 0.1.0)'
        required: false
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compute image tags
        id: tags
        run: |
          {
            echo "service-tags<<EOF"
            echo "docker.io/pipestreamai/grpc-libreoffice:latest"
            echo "git.rokkon.com/ai-pipestream/grpc-libreoffice:latest"
            if [ -n "${{ inputs.version }}" ]; then
              echo "docker.io/pipestreamai/grpc-libreoffice:${{ inputs.version }}"
              echo "git.rokkon.com/ai-pipestream/grpc-libreoffice:${{ inputs.version }}"
            fi
            echo "EOF"
            echo "ui-tags<<EOF"
            echo "docker.io/pipestreamai/grpc-libreoffice-ui:latest"
            echo "git.rokkon.com/ai-pipestream/grpc-libreoffice-ui:latest"
            if [ -n "${{ inputs.version }}" ]; then
              echo "docker.io/pipestreamai/grpc-libreoffice-ui:${{ inputs.version }}"
              echo "git.rokkon.com/ai-pipestream/grpc-libreoffice-ui:${{ inputs.version }}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub (docker.io)
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Log in to Forgejo container registry
        uses: docker/login-action@v3
        with:
          registry: git.rokkon.com
          username: ${{ github.actor }}
          password: ${{ secrets.CICD_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.tags.outputs.service-tags }}
      - name: Build and push frontend UI
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.tags.outputs.ui-tags }}
