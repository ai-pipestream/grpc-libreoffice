name: Publish Image

# Builds the image (the build stage runs the full test suite, real LibreOffice
# renders included, so the push is gated on green) and pushes it to
# docker.io/pipestreamai and our Forgejo container registry. The CICD_TOKEN
# org secret only exists on Forgejo (git.rokkon.com); on the GitHub mirror it
# is absent, so the Forgejo login and its tags are skipped there and the run
# pushes to docker.io only.
#
# amd64 only for now; LibreOffice exists on arm64 and a matrix build on the
# arm64 runners can follow if a consumer needs it.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Image version tag (for example 0.1.0)'
        required: false
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      # Empty on the GitHub mirror; set on Forgejo.
      CICD_TOKEN: ${{ secrets.CICD_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Compute image tags
        id: tags
        env:
          VERSION: ${{ inputs.version }}
        run: |
          {
            echo "service-tags<<EOF"
            echo "docker.io/pipestreamai/grpc-libreoffice:latest"
            if [ -n "$CICD_TOKEN" ]; then
              echo "git.rokkon.com/ai-pipestream/grpc-libreoffice:latest"
            fi
            if [ -n "$VERSION" ]; then
              echo "docker.io/pipestreamai/grpc-libreoffice:$VERSION"
              if [ -n "$CICD_TOKEN" ]; then
                echo "git.rokkon.com/ai-pipestream/grpc-libreoffice:$VERSION"
              fi
            fi
            echo "EOF"
            echo "ui-tags<<EOF"
            echo "docker.io/pipestreamai/grpc-libreoffice-ui:latest"
            if [ -n "$CICD_TOKEN" ]; then
              echo "git.rokkon.com/ai-pipestream/grpc-libreoffice-ui:latest"
            fi
            if [ -n "$VERSION" ]; then
              echo "docker.io/pipestreamai/grpc-libreoffice-ui:$VERSION"
              if [ -n "$CICD_TOKEN" ]; then
                echo "git.rokkon.com/ai-pipestream/grpc-libreoffice-ui:$VERSION"
              fi
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub (docker.io)
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Log in to Docker Hardened Images (dhi.io)
        # The frontend Dockerfile builds on dhi.io/node, and dhi.io rejects
        # anonymous pulls; the Docker Hub credentials double as dhi.io auth.
        uses: docker/login-action@v3
        with:
          registry: dhi.io
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Log in to Forgejo container registry
        if: ${{ env.CICD_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          registry: git.rokkon.com
          username: ${{ github.actor }}
          password: ${{ secrets.CICD_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.tags.outputs.service-tags }}
      - name: Build and push frontend UI
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.tags.outputs.ui-tags }}
